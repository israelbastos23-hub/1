    <!-- UTM Parameter Anti-Duplication Utility for UTMify & External Checkouts -->
    <script>
      (function() {
        function sanitizeCheckoutUrl(rawUrl) {
          if (!rawUrl || typeof rawUrl !== 'string') return rawUrl;
          try {
            var hashIdx = rawUrl.indexOf('#');
            var hash = hashIdx !== -1 ? rawUrl.substring(hashIdx) : '';
            var noHash = hashIdx !== -1 ? rawUrl.substring(0, hashIdx) : rawUrl;
            var qIdx = noHash.indexOf('?');
            if (qIdx === -1) return rawUrl;
            var base = noHash.substring(0, qIdx);
            var query = noHash.substring(qIdx + 1).replace(/\?/g, '&');
            var sp = new URLSearchParams(query);
            var map = new Map();
            sp.forEach(function(val, key) {
              var ck = key.trim();
              if (ck) {
                var lk = ck.toLowerCase();
                if (!map.has(lk) || (val && !map.get(lk).val)) {
                  map.set(lk, { key: ck, val: val.trim() });
                }
              }
            });
            var cleanSp = new URLSearchParams();
            map.forEach(function(item) {
              cleanSp.set(item.key, item.val);
            });
            var qs = cleanSp.toString();
            return base + (qs ? '?' + qs : '') + hash;
          } catch(e) {
            return rawUrl;
          }
        }
        window.__sanitizeCheckoutUrl = sanitizeCheckoutUrl;

        // Automatically clean links on click to prevent duplicate parameters
        document.addEventListener('click', function(e) {
          var target = e.target && e.target.closest ? e.target.closest('a') : null;
          if (target && target.href && (target.href.indexOf('checkout') !== -1 || target.href.indexOf('pagou.ai') !== -1 || target.href.indexOf('kaverecar.com') !== -1)) {
            target.href = sanitizeCheckoutUrl(target.href);
          }
        }, true);
      })();
    </script>
